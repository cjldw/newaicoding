<!DOCTYPE html>
<meta charset="utf-8">
<title>旗橙 · AI 研发流程平台</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ===== tokens · DESIGN.md(shadcn/ui New York,zinc)===== */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f4f5; --surface-3:#ececee;
  --border:#e4e4e7; --border-strong:#d4d4d8;
  --text:#09090b; --muted:#71717a; --faint:#a1a1aa;
  --primary:#18181b; --primary-hi:#27272a; --accent:#2563eb;
  --ring:rgba(161,161,170,.4);
  --blue-bg:#eff6ff; --blue-tx:#1d4ed8; --blue-bd:#bfdbfe;
  --green-bg:#f0fdf4; --green-tx:#15803d; --green-bd:#bbf7d0;
  --amber-bg:#fffbeb; --amber-tx:#b45309; --amber-bd:#fde68a;
  --red-bg:#fef2f2; --red-tx:#b91c1c; --red-bd:#fecaca;
  --violet-bg:#f5f3ff; --violet-tx:#6d28d9; --violet-bd:#ddd6fe;
  --zinc-bg:#f4f4f5; --zinc-tx:#3f3f46; --zinc-bd:#e4e4e7;
  --term-bg:#0e1116; --term-bd:#1e2530; --term-tx:#c9d4e3; --term-dim:#7d8899;
  --radius:10px; --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sans:'Geist',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;font:14px/1.55 var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
table{font:inherit;border-collapse:collapse}
button{font:inherit;color:inherit}
img,svg{vertical-align:middle}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12px}
.nowrap{white-space:nowrap}
/* ===== app shell ===== */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.logo b{font-size:14px;letter-spacing:-.01em;display:block;line-height:1.2}
.logo span{font-size:11px;color:var(--muted);display:block}
.sgroup{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.06em;padding:14px 10px 4px;text-transform:uppercase}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-weight:500}
.sitem:hover{background:var(--surface-2);color:var(--text)}
.sitem.on{background:var(--surface-2);color:var(--text)}
.sitem .ic{flex:none}
.sitem .cnt{margin-left:auto;font-size:11px;color:var(--faint);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0 6px}
.sitem.on .cnt{background:#fff}
.tour{margin-top:auto;border:1px solid var(--border);border-radius:var(--radius);padding:10px;background:var(--surface-2)}
.tour b{font-size:12px;display:block;margin-bottom:6px}
.tour a{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;padding:3px 2px;border-radius:4px}
.tour a:hover{color:var(--text);text-decoration:none}
.tour .n{width:15px;height:15px;border-radius:999px;background:#fff;border:1px solid var(--border-strong);color:var(--muted);font-size:10px;display:grid;place-items:center;flex:none;font-family:var(--mono)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);z-index:20;min-height:50px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex-wrap:wrap}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{color:var(--faint)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.demo-chip{font-size:11px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:999px;padding:2px 9px;background:var(--surface-2);white-space:nowrap}
.av{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;flex:none}
.av.sm{width:22px;height:22px;font-size:10px}
.av-stack{display:flex}
.av-stack .av{margin-left:-7px;border:2px solid #fff}
.av-stack .av:first-child{margin-left:0}
/* ===== page ===== */
.page{padding:22px 24px 48px;max-width:1240px;width:100%;margin:0 auto}
.page.wide{max-width:none}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:6px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;box-shadow:var(--shadow-sm);transition:background .12s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{background:var(--surface-3)}
.btn-pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-pri:hover{background:var(--primary-hi)}
.btn-pri:active{background:#3f3f46}
.btn-danger{color:var(--red-tx);border-color:var(--red-bd);background:var(--red-bg)}
.btn-danger:hover{background:#fee2e2}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface)}
.btn-sm{padding:3px 9px;font-size:12px}
.btn-ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.icon-btn{width:30px;height:30px;padding:0;justify-content:center}
/* ===== badges / chips ===== */
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1.5px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;line-height:1.5}
.b-blue{background:var(--blue-bg);color:var(--blue-tx);border-color:var(--blue-bd)}
.b-green{background:var(--green-bg);color:var(--green-tx);border-color:var(--green-bd)}
.b-amber{background:var(--amber-bg);color:var(--amber-tx);border-color:var(--amber-bd)}
.b-red{background:var(--red-bg);color:var(--red-tx);border-color:var(--red-bd)}
.b-violet{background:var(--violet-bg);color:var(--violet-tx);border-color:var(--violet-bd)}
.b-zinc{background:var(--zinc-bg);color:var(--zinc-tx);border-color:var(--zinc-bd)}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor;flex:none}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.chip{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;color:var(--zinc-tx);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip .ic{color:var(--faint)}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
/* ===== cards ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-head .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card-body{padding:16px}
.card-body.tight{padding:0}
.card-foot{border-top:1px solid var(--border);padding:9px 16px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kvs{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.kv{padding:10px 16px;border-right:1px solid var(--border);min-width:130px;flex:1}
.kv:last-child{border-right:none}
.kv label{display:block;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.kv div{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
/* ===== tables ===== */
.scrollx{overflow-x:auto}
.tbl{width:100%;font-size:13px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .rowclick{cursor:pointer}
/* ===== tabs ===== */
.twrap{min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;padding:8px 13px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--primary)}
.tab .n{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--muted)}
.pane{display:none}
.pane.on{display:block}
.pane.on.fill{display:flex;flex-direction:column;min-height:0;flex:1}
/* ===== stepper ===== */
.stepper{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 2px 10px;gap:0;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stp{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:86px;position:relative;flex:1}
.stp::before{content:"";position:absolute;top:8px;right:50%;width:100%;height:2px;background:var(--border)}
.stp:first-child::before{display:none}
.stp .d{width:17px;height:17px;border-radius:999px;background:#fff;border:2px solid var(--border-strong);display:grid;place-items:center;position:relative;z-index:1;color:transparent}
.stp.done .d{background:var(--primary);border-color:var(--primary);color:#fff}
.stp.cur .d{border-color:var(--primary);color:var(--primary)}
.stp.cur .d::after{content:"";width:7px;height:7px;border-radius:999px;background:var(--primary)}
.stp span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.stp.done span,.stp.cur span{color:var(--text);font-weight:500}
/* ===== grid layouts ===== */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid-sb{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* ===== project cards ===== */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .12s, box-shadow .12s}
.pcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.pcard h3{font-size:15px;display:flex;align-items:center;gap:8px}
.pcard p{margin:0;color:var(--muted);font-size:13px}
.pcard .meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.pcard .meta span{display:inline-flex;gap:5px;align-items:center}
.pcard .foot{display:flex;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
/* ===== file tree ===== */
.tree{padding:10px 8px;font-size:13px}
.tnode{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:default;color:var(--text);white-space:nowrap}
.tnode.dir{color:var(--muted);font-weight:500}
.tnode.sel{background:var(--surface-2)}
.tnode .ic{color:var(--faint);flex:none}
.tnode .nm{overflow:hidden;text-overflow:ellipsis}
.fdot{width:6px;height:6px;border-radius:999px;margin-left:auto;flex:none}
.fdot.a{background:var(--blue-tx)}
.fdot.m{background:var(--amber-tx)}
.tree-foot{border-top:1px solid var(--border);padding:9px 12px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tree-foot b{color:var(--text);font-weight:500}
/* ===== editor ===== */
.ed{display:flex;flex-direction:column;min-height:0;flex:1;background:var(--surface)}
.ed-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.edtab{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:7px 12px;border-right:1px solid var(--border);color:var(--muted);cursor:pointer;white-space:nowrap;background:none;border-top:none;border-bottom:none;border-left:none}
.edtab.on{background:var(--surface);color:var(--text);box-shadow:inset 0 2px 0 var(--primary)}
.ed-scroll{overflow:auto;flex:1;min-height:0;background:var(--surface)}
.ed-code{font-family:var(--mono);font-size:12.5px;line-height:1.65;padding:10px 0;min-width:max-content}
.cl{display:flex;white-space:pre}
.cl .ln{width:46px;flex:none;text-align:right;padding-right:14px;color:var(--faint);user-select:none;font-size:11.5px}
.cl .lc{padding-right:24px}
.cl.hl{background:var(--blue-bg)}
.c-kw{color:#cf222e;font-style:normal}
.c-st{color:#0a3069;font-style:normal}
.c-cm{color:#6e7781;font-style:normal}
.c-num{color:#0550ae;font-style:normal}
.c-fn{color:#8250df;font-style:normal}
/* ===== diff ===== */
.d-chips{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border)}
.dchip{font-family:var(--mono);font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:3px 9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.dchip.on{border-color:var(--primary);background:var(--surface-2)}
.dchip .s{font-size:11px}
.dchip .add{color:var(--green-tx)}
.dchip .del{color:var(--red-tx)}
.dl{display:flex;font-family:var(--mono);font-size:12px;line-height:1.7;white-space:pre}
.dl .no{width:38px;flex:none;text-align:right;padding-right:10px;color:var(--faint);user-select:none;font-size:11px}
.dl .tx{padding-right:20px}
.dl-add{background:#e6ffec}
.dl-add .tx{color:#116329}
.dl-del{background:#ffebe9}
.dl-del .tx{color:#82071d}
.dl-hunk{background:var(--surface-2);color:var(--muted)}
.dl-hunk .tx{color:var(--muted)}
/* ===== preview ===== */
.pv{display:flex;flex-direction:column;min-height:0;flex:1;background:var(--surface-2)}
.pv-chrome{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.pv-dots{display:flex;gap:5px}
.pv-dots i{width:9px;height:9px;border-radius:999px;background:var(--border-strong)}
.pv-url{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-body{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center;align-items:flex-start}
.pv-app{width:100%;max-width:460px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);overflow:hidden}
.shop-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.cart-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border)}
.cart-thumb{width:38px;height:38px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--faint);flex:none}
.cart-item .nm{font-size:13px;font-weight:500}
.cart-item .pr{margin-left:auto;font-family:var(--mono);font-size:13px}
.coupon{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:12.5px;border-bottom:1px dashed var(--border)}
.coupon .ck{width:16px;height:16px;border-radius:999px;background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green-tx);display:grid;place-items:center;flex:none}
.coupon .who{margin-left:auto;font-size:11px;color:var(--faint)}
.sumrow{display:flex;justify-content:space-between;padding:6px 16px;font-size:12.5px;color:var(--muted)}
.sumrow b{color:var(--text);font-family:var(--mono);font-weight:500}
.sumrow.save b{color:var(--green-tx)}
.sumrow.pay{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;padding-bottom:14px;font-size:14px}
.sumrow.pay b{font-size:17px;font-weight:600}
.pv-note{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
/* ===== terminal ===== */
.term{background:var(--term-bg);border:1px solid var(--term-bd);border-radius:var(--radius-sm);display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.term-head{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--term-bd);color:var(--term-dim);font-size:11.5px;font-family:var(--mono)}
.term-head .right{margin-left:auto}
.term-body{padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.65;overflow:auto;flex:1;min-height:0;color:var(--term-tx)}
.tl{white-space:pre-wrap;word-break:break-all;min-height:1.2em}
.t-dim{color:var(--term-dim)}
.t-tool{color:#79c0ff}
.t-ok{color:#4ade80}
.t-ai{color:#c4b5fd}
.t-cmd{color:#e6edf3}
.t-prompt{color:#7d8899}
.ai-chip{display:inline-block;background:rgba(124,58,237,.22);border:1px solid rgba(167,139,250,.4);color:#d6c7ff;border-radius:4px;padding:0 5px;font-size:11px}
.cursor{display:inline-block;width:7px;height:14px;background:#e6edf3;vertical-align:-2px;animation:pulse 1s steps(2) infinite}
/* ===== chat ===== */
.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.chat-list{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{display:flex;gap:10px;min-width:0}
.msg .role-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.msg.ai .role-ic{background:var(--violet-bg);border-color:var(--violet-bd);color:var(--violet-tx)}

.bubble{font-size:13px;white-space:pre-wrap;word-break:break-word}

.fref .inj{font-size:10px;color:var(--faint)}
.att-row{display:flex;gap:7px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface-2)}
.att{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border);background:#fff;border-radius:6px;padding:3px 8px}
.chat-input{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding:10px 12px}

.chat-hint{padding:0 14px 8px;font-size:11px;color:var(--faint)}

.input{width:100%;font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)}

.input:focus{outline:none;border-color:var(--faint);box-shadow:0 0 0 3px var(--ring)}
.search{position:relative;flex:1;max-width:340px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{padding-left:32px}
/* ===== activity stream ===== */
.act{padding:6px 0;overflow:auto;flex:1;min-height:0}

.act-ic{width:24px;height:24px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);flex:none;margin-top:1px}
.act-ic.git{background:var(--blue-bg);border-color:var(--blue-bd);color:var(--blue-tx)}
.act-ic.wr{background:var(--violet-bg);border-color:var(--violet-bd);color:var(--violet-tx)}
.act-ic.ok{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-tx)}
.act-t{min-width:0;flex:1}
.act-t b{font-family:var(--mono);font-size:11.5px;font-weight:600}
.act-t .p{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.act-t .sub{color:var(--faint);font-size:11.5px}
.act-meta{margin-left:auto;color:var(--faint);font-size:11px;font-family:var(--mono);white-space:nowrap;flex:none}
.act-foot{border-top:1px solid var(--border);padding:8px 14px;font-size:11.5px;color:var(--muted);display:flex;gap:14px;font-family:var(--mono)}
/* ===== checklist (PRD) ===== */
.cklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.cklist li{display:flex;gap:9px;align-items:flex-start;font-size:13px}
.ckbox{width:16px;height:16px;border-radius:5px;border:1px solid var(--border-strong);display:grid;place-items:center;flex:none;margin-top:2px;color:#fff}
.ckbox.on{background:var(--green-tx);border-color:var(--green-tx)}
.ckbox.off{background:#fff}
.cklist li.off-t{color:var(--muted)}

.timeline{position:relative;padding:4px 0}
.tl-item{display:flex;gap:12px;position:relative;padding:0 0 18px 0}
.tl-item::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:18px;height:18px;border-radius:999px;background:#fff;border:2px solid var(--border-strong);display:grid;place-items:center;color:var(--muted);flex:none;position:relative;z-index:1}
.tl-item.done .tl-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.tl-item .tl-c{min-width:0;flex:1}
.tl-item .tl-t{font-size:13px;font-weight:500}
.tl-item .tl-m{font-size:12px;color:var(--muted)}

.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}

.kb-card h4{font-size:13.5px}
.kb-card p{margin:0;font-size:12.5px;color:var(--muted)}
.tag{font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;color:var(--muted)}

.modal{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);max-height:88vh;overflow:auto}
.m-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600}
.m-head .x{margin-left:auto}
.m-body{padding:18px;display:flex;flex-direction:column;gap:13px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--border)}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:5px}
/* ===== toast ===== */
.toast-wrap{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center;pointer-events:none;padding:0 16px}
.toast{background:var(--primary);color:#fff;font-size:13px;border-radius:999px;padding:8px 18px;box-shadow:var(--shadow-md);animation:tin .18s ease-out;max-width:90vw;text-align:center}

const CODE_COUPON = `import type { Cart, Coupon, CouponKind, ApplyResult } from "./types";

/** 叠加顺序:满减 → 折扣 → 运费券(活动规则.md §3.2) */
const STACK_ORDER: CouponKind[] = ["full_reduction", "discount", "shipping"];

/** 互斥组:同组内仅可选一张,组内贪心取优惠最大 */
const MUTEX_GROUPS: Record<string, CouponKind[]> = {
  full_reduction: ["full_reduction"],
  discount: ["discount"],
};

export function applyCoupons(cart: Cart, coupons: Coupon[]): ApplyResult {
  const picked = pickBestPerGroup(cart, coupons, MUTEX_GROUPS);
  const ordered = sortCoupons(picked, STACK_ORDER);

  let payable = cart.subtotal;
  const applied: Coupon[] = [];
  for (const c of ordered) {
    const amount = amountFor(c, payable);
    if (amount <= 0) continue;
    payable = Math.max(0, payable - amount); // 边界:叠加后不为负
    applied.push(c);
  }
  return { payable: round2(payable), applied, saved: round2(cart.subtotal - payable) };
}

function amountFor(c: Coupon, payable: number): number {
  return c.kind === "discount" ? payable * (1 - c.value) : Math.min(c.value, payable);
}`;

import { FULL_120, DISCOUNT_90, FREESHIP } from "./fixtures";

  const r = applyCoupons(makeCart(169700), [FULL_120, DISCOUNT_90, FREESHIP]);
  expect(r.payable).toBe(140730); // 1697 → 1527.3 → 1407.3

});`;

/* ================= 代码高亮 ================= */
function hl(line){
  let s = esc(line);
  s = s.replace(/(\/\/[^\n]*)|(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)|\b(export|import|from|function|const|let|return|for|of|if|else|new|type|interface|as|await|async|class|this|expect|it)\b|\b(\d+(?:\.\d+)?)\b/g,
    (m,cm,st,kw,num)=> cm!==undefined?`<i class="c-cm">${cm}</i>` : st!==undefined?`<i class="c-st">${st}</i>` : kw!==undefined?`<i class="c-kw">${kw}</i>` : `<i class="c-num">${num}</i>`);
  return s;
}
const codeBlock = c => c.split('\n').map((l,i)=>`<div class="cl"><span class="ln">${i+1}</span><span class="lc">${l===''?'':hl(l)}</span></div>`).join('');
const diffBlock = lines => lines.map((l,i)=>{
  const no = l[0]==='h'?'…':l[0]==='c'?String(i+1):l[0]==='a'?String(i+1):String(i+1);
  return `<div class="dl dl-${l[0]==='a'?'add':l[0]==='d'?'del':l[0]==='h'?'hunk':'ctx'}"><span class="no">${no}</span><span class="tx">${esc(l[1].replace(/^[+-] /,''))}</span></div>`;
}).join('');

  <div style="border:1px dashed var(--border-strong);border-radius:8px;padding:18px;text-align:center;color:var(--faint);font-size:12.5px">${ic('file',13)} 资源未导入(仅导入 .md 文本,相对路径图片不导入)</div>`;
function pageKb(pid, kbid){
  const p = PROJECTS.find(x=>x.id===pid) || PROJECTS[0];
  const kb = (KB_SPACES[p.id]||[]).find(k=>k.id===kbid) || (KB_SPACES[p.id]||[])[0];
  if(!kb) return shell('<div class="page">未找到知识库</div>','','projects');
  const isImport = kb.type==='repo_import';
  return shell(`<div class="page wide">
    <div class="page-head">
      <div><h1>${ic('book-open',18)} ${kb.name} <span class="bdg ${KB_TYPE2[kb.type][1]}">${KB_TYPE2[kb.type][0]}</span></h1>
        <div class="sub chip-row">${projChip(p.id)}
          ${isImport?`<span class="bdg ${KBS[kb.status||'done'][1]}">${KBS[kb.status||'done'][0]}</span><span class="small muted">同步于 ${kb.synced} · 来源 ${kb.src}</span>`
            :`<span class="small muted">${kb.pages} 个页面 · 更新于 ${kb.upd}</span>`}
          <span class="chip">${ic('file-text',11)}${kb.pages} 页</span></div></div>
      <div class="acts">
        <div class="search">${ic('search',14)}<input class="input" placeholder="库内标题 / 全文搜索…" oninput="toast('演示环境:FULLTEXT 检索为静态展示')"></div>
        ${isImport
          ? `<button class="btn" onclick="toast('同步任务已入队 · 按原 source_config 重新拉取,事务内整体替换快照;完成后站内信 + toast 通知')">${ic('refresh')}重新导入</button>`
          : `<button class="btn btn-pri" onclick="toast('演示环境:新建页面(blank 树形目录 + Monaco 编辑 + 预览)')">${ic('plus')}新建页面</button>`}
      </div>
    </div>
    <div class="card" style="overflow:hidden">
      <div class="wiki">
        <div class="wiki-tree tree">${WIKI_NODES.map(f=>`<div class="tnode${f.sel?' sel':''}" style="padding-left:${10 + f.d*16}px" onclick="wikiOpen(this)">
          ${ic(f.i,13)}<span class="nm mono">${f.n}</span></div>`).join('')}
        </div>
        <div class="wiki-body mdc">${WIKI_CONTENT}</div>
      </div>
      <div class="card-foot">${isImport
        ? `${ic('alert',13)} 导入型只读:编辑入口隐藏,API 写操作 403(前后端双重拦截);以仓库为准——同步后已删除源文件的页面一并移除;相对路径图片标注「资源未导入」。`
        : `${ic('alert',13)} 空模板:owner / editor 可增删改、拖拽排序(Monaco 编辑 + 预览);内容存平台数据库;后保存覆盖前者。`}</div>
    </div>
  </div>`, `${crumbLink('#/projects','项目')} ${sep} ${crumbLink('#/p/'+p.id, p.name)} ${sep} ${crumbLink('#/p/'+p.id, '知识库')} ${sep} ${crumbLink('', kb.name)}`, 'projects');
}
function wikiOpen(el){ document.querySelectorAll('.wiki-tree .tnode').forEach(n=>n.classList.toggle('sel', n===el)); toast('演示环境:仅「stack-rules.md」页有示例内容'); }
/* ================= 路由 ================= */
function render(){
  TERM_GEN++;
  const h = location.hash.replace(/^#\/?/, '');
  const seg = h.split('/').filter(Boolean);
  const [p0, p1, p2, p3] = seg;
  let html, act;
  if(!p0){ html = pageDashboard(); act = 'dashboard'; }
  else if(p0==='projects'){ html = pageProjects(); act = 'projects'; }
  else if(p0==='login'){ html = pageLogin(); act = ''; }
  else if(p0==='p' && p1 && p2==='kb' && p3){ html = pageKb(p1, p3); act = 'projects'; }
  else if(p0==='p' && p1){ html = pageProject(p1, 'requirements'); act = 'projects'; }
  else if(p0==='r' && p1){ html = pageReq(p1); act = 'projects'; }
  else if(p0==='t' && p1){ html = pageTask(p1); act = 'projects'; }
  else if(p0==='archive' && p1){ html = pageArchive(p1); act = 'projects'; }
  else if(p0==='knowledge'){ html = pageKnowledge(); act = 'knowledge'; }
  else if(p0==='runners'){ html = pageRunners(); act = 'runners'; }
  else if(p0==='manage'){ html = pageManage(p1 || 'requirements'); act = 'manage/' + (p1 || 'requirements'); }
  else if(p0==='admin' && p1==='users'){ html = pageAdminUsers(); act = 'admin/users'; }
  else if(p0==='admin' && p1==='audit'){ html = pageAdminAudit(); act = 'admin/audit'; }
  else { html = pageDashboard(); act = 'dashboard'; }
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();
</script>
